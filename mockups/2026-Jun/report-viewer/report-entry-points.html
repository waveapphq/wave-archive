<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
  --bg-page: #FAFAF9;
  --bg-card: #FFFFFF;
  --bg-subtle: #F4F4F3;
  --text-primary: #0C0A09;
  --text-secondary: #44403C;
  --text-muted: #78716C;
  --border-default: #E7E5E4;
  --border-strong: #D6D3D1;
  --accent: #2563EB;
  --error: #DC2626;
}
html.dark {
  --bg-page: #0C0A09;
  --bg-card: #1C1917;
  --bg-subtle: #292524;
  --text-primary: #FAFAF9;
  --text-secondary: #D6D3D1;
  --text-muted: #A8A29E;
  --border-default: #292524;
  --border-strong: #44403C;
  --accent: #3B82F6;
  --error: #F87171;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font-body); background: var(--bg-page); color: var(--text-primary); font-size: 14px; padding: 24px; display: flex; flex-direction: column; gap: 26px; }
.ep-label { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.ep-bar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 10px; }
.ep-bar2 { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 10px; }
.ep-back { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 7px; border: none; background: transparent; color: var(--text-secondary); }
.ep-name { font-size: 16px; font-weight: 700; }
.ep-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--error); }
.ep-status .ep-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--error); }
.ep-spacer { flex: 1; }
.ep-btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; position: relative; }
.ep-btn svg { width: 14px; height: 14px; }
.ep-btn.ep-danger { color: var(--error); }
.ep-btn.ep-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ep-btn.ep-disabled { opacity: 0.7; }
.ep-btn.ep-new { box-shadow: 0 0 0 2px var(--accent); }
.ep-tag { position: absolute; top: -10px; right: -8px; font-size: 9px; font-weight: 800; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: #fff; }
.ep-envk { font-size: 12px; color: var(--text-muted); }
.ep-envv { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>

<div>
  <div class="ep-label">A - Suite / Regression execution detail header (terminal execution): Report between Re-run and Export</div>
  <div class="ep-bar">
    <button class="ep-back"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="ep-name">Nightly API Suite</span>
    <span class="ep-status"><span class="ep-dot"></span>Failed</span>
    <div class="ep-spacer"></div>
    <button class="ep-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>Re-run</button>
    <button class="ep-btn ep-new"><span class="ep-tag">NEW</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 17v-3"/><path d="M12 17v-6"/><path d="M16 17v-1"/></svg>Report</button>
    <button class="ep-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Export</button>
    <button class="ep-btn ep-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Delete</button>
  </div>
</div>

<div>
  <div class="ep-label">B - Test execution detail = historical canvas action bar: Report before Open in Workbench</div>
  <div class="ep-bar2">
    <div class="ep-spacer"></div>
    <button class="ep-btn ep-disabled"><span class="ep-envk">Env:</span><span class="ep-envv">Local</span></button>
    <button class="ep-btn ep-new"><span class="ep-tag">NEW</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 17v-3"/><path d="M12 17v-6"/><path d="M16 17v-1"/></svg>Report</button>
    <button class="ep-btn ep-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>Open in Workbench</button>
  </div>
</div>

</body>
</html>
